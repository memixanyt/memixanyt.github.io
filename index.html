<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График смен Озон</title>
<style>
:root{--bg:#12151c;--card:#1b1f2a;--tx:#fff;--mut:#8a90a2;--pu:#7c3aed;--ln:#2a3040;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b1f2a;--tx:#fff;--mut:#8a90a2;--ln:#2a3040;color-scheme:dark}}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f8;--card:#fff;--tx:#161a23;--mut:#6b7285;--ln:#e1e4ee;color-scheme:light}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b1f2a;--tx:#fff;--mut:#8a90a2;--ln:#2a3040;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:560px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
.top{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-radius:22px;padding:14px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;color:#fff}
.top b{font-size:17px}.top span{font-size:12px;border:1px solid #fff8;border-radius:12px;padding:6px 10px;background:#fff2}
.card{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:14px;margin-top:12px}
.dt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.dt h2{margin:0;font-size:20px}.dt small{color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:11px;padding:9px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--pu);color:#fff}
.pr{display:flex;align-items:center;gap:10px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));border-radius:14px;padding:10px 12px;margin-top:8px;position:relative}
.pr .l{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}
.pr .n{font-weight:700}
.pr .s{font-size:12px;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.badge{position:absolute;right:10px;top:-8px;background:var(--pu);color:#fff;font-size:9px;font-weight:800;border-radius:8px;padding:2px 7px}
.mh{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}
.mh h2{margin:0;font-size:21px}
.nav{background:none;border:0;font-size:26px;color:var(--mut);padding:0 10px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.wd{color:var(--mut);font-weight:700;margin-bottom:6px;font-size:12px}.wd span:nth-child(n+6){color:#f87171}
.d{aspect-ratio:1/1;border-radius:11px;border:0;background:color-mix(in srgb,var(--c) 40%,var(--card));color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;line-height:1.1}
.d small{font-size:9px;opacity:.8}
.d.t{outline:2px solid var(--pu);outline-offset:-2px}
.d.s{box-shadow:0 0 0 2px var(--tx) inset}
.lg{display:flex;flex-direction:column;gap:6px;font-size:13px}
.lg div{display:flex;gap:8px;align-items:flex-start}
.lg i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;margin-top:3px}
.mut{color:var(--mut);font-size:12px;margin-top:10px}
</style></head><body>
<div id="app"></div>
<script>
// ===== ДАННЫЕ (график 2/1/2/3 = Д Д В Н Н В В В, по таблице на ноябрь 2026) =====
// start — день, когда смена начинает цикл (первый «Д»). Цикл повторяется каждые 8 дней.
const CREWS=[
 {n:1,start:'2026-11-06',color:'#16a34a',p:{'Подбор':'Махинов Никита Алексеевич','ОПИР':'Танцевило Андрей Юрьевич'}},
 {n:2,start:'2026-11-08',color:'#7c3aed',p:{'Подбор':'Яковлев Алексей Юрьевич','ОПИР':'Овчаренко Елизавета Николаевна'}},
 {n:3,start:'2026-11-02',color:'#0891b2',p:{'Подбор':'Неживёнок Владимир Владимирович','ОПИР':'Максименков Василий Владимирович'}},
 {n:4,start:'2026-11-04',color:'#c2410c',p:{'Подбор':'Сафонов Владимир Игоревич','ОПИР':'Бердников Дмитрий Евгеньевич'}}
];
const PR=['Подбор','ОПИР'];
const DAY_FROM=8,NIGHT_FROM=20; // граница дня и ночи, часы
// ===============================================================================
const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WDN=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const $=s=>document.querySelector(s);
const dn=(y,m,d)=>Date.UTC(y,m,d)/864e5;
const pd=s=>{const p=s.split('-');return dn(+p[0],+p[1]-1,+p[2])};
const ud=n=>new Date(n*864e5);
function st(c,n){const i=(((n-pd(c.start))%8)+8)%8;return i<2?'d':(i===3||i===4)?'n':''}
const who=(n,sh)=>CREWS.find(c=>st(c,n)===sh);
const ini=n=>n.split(/\s+/).slice(0,2).map(w=>w[0]).join('');
const short=n=>{const a=n.split(/\s+/);return a[0]+' '+a[1]};
const now=new Date(),h=now.getHours();
const TODAY=dn(now.getFullYear(),now.getMonth(),now.getDate());
// «сейчас»: ночная смена до 8 утра относится к предыдущей дате
let NOW_D=TODAY,NOW_S='d';
if(h<DAY_FROM){NOW_D=TODAY-1;NOW_S='n'}else if(h>=NIGHT_FROM)NOW_S='n';
let S=NOW_D,shift=NOW_S,ym={y:ud(S).getUTCFullYear(),m:ud(S).getUTCMonth()};
function render(){
  const D=ud(S);
  let o='<div class="top"><b>Ozon Job Календарь</b><span>Воронеж 2 РФЦ</span></div>';
  o+='<div class="card"><div class="dt"><h2>'+D.getUTCDate()+' '+GEN[D.getUTCMonth()]+'</h2><small>'+WDN[D.getUTCDay()]+(S===TODAY?' · сегодня':'')+'</small></div>';
  o+='<div class="seg"><button class="'+(shift==='d'?'on':'')+'" onclick="shift=\'d\';render()">☀ День</button><button class="'+(shift==='n'?'on':'')+'" onclick="shift=\'n\';render()">🌙 Ночь</button></div>';
  const c=who(S,shift);
  PR.forEach(p=>{const nm=c.p[p];
    o+='<div class="pr" style="--c:'+c.color+'">'+((S===NOW_D&&shift===NOW_S)?'<span class="badge">СЕЙЧАС</span>':'')+'<span class="av">'+ini(nm)+'</span><div><div class="l">'+p+'</div><div class="n">'+short(nm)+'</div><div class="s">Смена №'+c.n+' · '+nm.split(/\s+/).slice(2).join(' ')+'</div></div></div>'});
  if(shift==='n')o+='<div class="mut">Ночная смена начинается вечером этой даты и заканчивается утром следующего дня.</div>';
  o+='</div><div class="card"><div class="mh"><h2>'+MON[ym.m]+' '+ym.y+'</h2><span><button class="nav" onclick="mv(-1)">‹</button><button class="nav" onclick="mv(1)">›</button></span></div>';
  o+='<div class="wd"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div><div class="grid">';
  const off=(new Date(Date.UTC(ym.y,ym.m,1)).getUTCDay()+6)%7,dim=new Date(Date.UTC(ym.y,ym.m+1,0)).getUTCDate();
  for(let i=0;i<off;i++)o+='<span></span>';
  for(let d=1;d<=dim;d++){const n=dn(ym.y,ym.m,d),k=who(n,shift);
    o+='<button class="d'+(n===TODAY?' t':'')+(n===S?' s':'')+'" style="--c:'+k.color+'" onclick="S='+n+';render()">'+d+'<small>№'+k.n+'</small></button>'}
  o+='</div><div class="mut">Цвет дня — смена, которая работает выбранной сменой ('+(shift==='d'?'день':'ночь')+').</div></div>';
  o+='<div class="card lg">'+CREWS.map(c=>'<div style="--c:'+c.color+'"><i></i><span><b>Смена №'+c.n+'</b> — '+PR.map(p=>p+': '+short(c.p[p])).join(' · ')+'</span></div>').join('')+'<div class="mut" style="margin:4px 0 0">Схема: 2 дня · 1 выходной · 2 ночи · 3 выходных. Даты считаются от реального календаря, на любой месяц.</div></div>';
  $('#app').innerHTML=o;
}
function mv(k){ym.m+=k;if(ym.m<0){ym.m=11;ym.y--}if(ym.m>11){ym.m=0;ym.y++}render()}
render();
</script></body></html>
